name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Shim for nose on py3.10
        run: |
          python - <<'PY'
import pathlib, collections, collections.abc
p = pathlib.Path("sitecustomize.py")
p.write_text(
"import collections, collections.abc\n"
"for n in ('Callable','Mapping','MutableMapping','Sequence'):\n"
"    if not hasattr(collections, n):\n"
"        setattr(collections, n, getattr(collections.abc, n))\n"
)
PY

      - name: Run tests (SQLite)
        env:
          # Force SQLite everywhere the app might read
          DATABASE_URL: "sqlite:///./db/test_ci.db"
          DATABASE_URI: "sqlite:///./db/test_ci.db"
          SQLALCHEMY_DATABASE_URI: "sqlite:///./db/test_ci.db"
          # Nuke any Postgres-ish env that could override config
          POSTGRES_HOST: ""
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
          POSTGRES_PORT: ""
          PGHOST: ""
          PGUSER: ""
          PGPASSWORD: ""
          PGPORT: ""
        run: |
          mkdir -p db && rm -f db/test_ci.db
          nosetests -sv --with-coverage --cover-package=service
